name: pythonworkflow

on: workflow_dispatch

jobs:

  data_pipeline:
    name: data_pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        run:  |
          pwd
          ls -la
          pwd
          cd ModelCleaning
          pip install pandas
          python cleandata.py
          ls -la
                    
      - name: train_test_dataset
        run:  |
          pip install scikit-learn joblib
          python ModelCleaning/train_test_dataset.py
